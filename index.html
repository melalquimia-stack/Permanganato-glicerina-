<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador: Oxidación de Glicerina con Permanganato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        header {
            text-align: center;
        }
        h1 {
            font-size: 1.4rem;
            color: #c084fc;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #1e293b;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 4px solid #334155;
            width: 100%;
            height: 100%;
        }
        .status-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        #status-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 4px;
        }
        #temp-text {
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        button {
            background-color: #9333ea;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
            transition: background 0.2s;
        }
        button:active {
            background-color: #7e22ce;
            transform: scale(0.98);
        }
        button.secondary {
            background-color: #334155;
            box-shadow: none;
            color: #cbd5e1;
        }
        button.secondary:active {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <header>
        <h1>Simulador: Glicerina + KMnO₄</h1>
        <p class="subtitle">Reacción Redox Exotérmica</p>
    </header>

    <div class="canvas-container">
        <canvas id="labCanvas" width="400" height="400"></canvas>
    </div>

    <div class="status-box">
        <div id="status-text">Estado: Listo para agregar glicerina</div>
        <div id="temp-text">Temperatura: 20 °C (Ambiente)</div>
    </div>

    <div class="controls">
        <button id="btn-action" onclick="agregarGlicerina()">1. Agregar Glicerina</button>
        <button class="secondary" onclick="reiniciarExperimento()">Reiniciar Experimento</button>
    </div>

    <script>
        const canvas = document.getElementById('labCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status-text');
        const tempText = document.getElementById('temp-text');
        const btnAction = document.getElementById('btn-action');

        let state = 0; // 0: Listo, 1: Glicerina añadida, 2: Inducción humeante, 3: Llama violeta, 4: Finalizado
        let temp = 20;
        let particles = [];

        function drawBackground() {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar cápsula de porcelana
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(200, 260, 130, 0, Math.PI);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(200, 250, 115, 0, Math.PI);
            ctx.fill();
        }

        function drawPowder() {
            // Montículo de Permanganato de Potasio
            ctx.fillStyle = '#581c87';
            ctx.beginPath();
            ctx.ellipse(200, 240, 70, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            // Cráter central
            if (state >= 1) {
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.ellipse(200, 235, 20, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGlicerina() {
            if (state >= 1 && state < 4) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(200, 236, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSmokeAndFlame() {
            if (state >= 2) {
                if (particles.length < 40 && state < 4) {
                    particles.push({
                        x: 200 + (Math.random() - 0.5) * 20,
                        y: 220,
                        radius: Math.random() * 8 + 5,
                        alpha: 0.6,
                        speedY: Math.random() * 2 + 1,
                        color: state === 3 ? (Math.random() > 0.5 ? '#d946ef' : '#38bdf8') : '#64748b'
                    });
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;

                    p.y -= p.speedY;
                    p.alpha -= 0.015;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            if (state === 3) {
                ctx.fillStyle = '#9333ea';
                ctx.beginPath();
                ctx.moveTo(170, 230);
                ctx.quadraticCurveTo(200, 100 + Math.sin(Date.now() / 50) * 15, 230, 230);
                ctx.fill();

                ctx.fillStyle = '#e879f9';
                ctx.beginPath();
                ctx.moveTo(185, 230);
                ctx.quadraticCurveTo(200, 130, 215, 230);
                ctx.fill();
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawPowder();
            drawGlicerina();
            drawSmokeAndFlame();
            requestAnimationFrame(render);
        }

        function agregarGlicerina() {
            if (state === 0) {
                state = 1;
                statusText.innerText = "Estado: Glicerina añadida. Esperando reacción...";
                temp = 35;
                tempText.innerText = `Temperatura: ${temp} °C (Inicio de oxidación)`;
                btnAction.innerText = "Observando inducción...";
                btnAction.disabled = true;

                setTimeout(() => {
                    state = 2;
                    temp = 120;
                    statusText.innerText = "Estado: Reacción exotérmica (Desprendimiento de gases)";
                    tempText.innerText = `Temperatura: ${temp} °C (Calentándose)`;

                    setTimeout(() => {
                        state = 3;
                        temp = 450;
                        statusText.innerText = "¡Combustión espontánea! Llama violeta";
                        tempText.innerText = `Temperatura: ${temp} °C (¡Punto de ignición!)`;

                        setTimeout(() => {
                            state = 4;
                            temp = 80;
                            statusText.innerText = "Estado: Reacción finalizada (Cápsula caliente)";
                            tempText.innerText = `Temperatura: ${temp} °C (Enfriándose)`;
                            btnAction.innerText = "Experimento completado";
                        }, 4000);

                    }, 3000);

                }, 3000);
            }
        }

        function reiniciarExperimento() {
            state = 0;
            temp = 20;
            particles = [];
            statusText.innerText = "Estado: Listo para agregar glicerina";
            tempText.innerText = `Temperatura: ${temp} °C (Ambiente)`;
            btnAction.innerText = "1. Agregar Glicerina";
            btnAction.disabled = false;
        }

        render();
    </script>
</body>
</html>
